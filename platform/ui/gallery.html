<style>
  /* Gallery-only layout. Components come from kit.css. */
  .g-wrap { width: 100%; max-width: 1200px; margin-inline: auto; padding-inline: var(--b-gutter); }
  .g-head { position: relative; display: flex; align-items: center; gap: var(--b-s-3); padding-block: var(--b-s-4); }
  .g-brand { display: flex; align-items: center; gap: 10px; color: var(--b-ink); text-decoration: none; }
  .g-brand svg { width: 22px; height: 22px; fill: none; stroke: var(--b-accent-text); stroke-width: 2.4; stroke-linecap: round; }
  .g-brand b { font-family: var(--b-font-d); font-weight: var(--b-display-weight); font-size: calc(var(--b-t-xl) * var(--b-d-scale) * 1.05); line-height: 1; letter-spacing: var(--b-display-track); }
  .g-brand span { font-family: var(--b-font-m); font-size: var(--b-t-2xs); letter-spacing: .14em; text-transform: uppercase; color: var(--b-mut); padding-inline-start: 10px; border-inline-start: 1px solid var(--b-line-2); line-height: 1.2; }
  .g-head .b-lang { margin-inline-start: auto; }

  .g-hero { padding-block: clamp(24px, 6vw, 72px) clamp(28px, 4vw, 48px); display: flex; flex-direction: column; gap: var(--b-s-4); }
  .g-hero .b-display { max-width: 15ch; }
  .g-hero .b-lede { max-width: 58ch; }
  .g-themes { display: flex; flex-direction: column; gap: var(--b-s-2); margin-top: var(--b-s-3); }
  .g-themes .b-seg { align-self: flex-start; }

  .g-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(40px, 6vw, 72px); padding-bottom: var(--b-section); }
  .g-grid > *, .g-cols > *, .g-demo > * { min-width: 0; }
  @media (min-width: 1000px) {
    .g-grid { grid-template-columns: 404px minmax(0, 1fr); align-items: start; }
    .g-device { position: sticky; top: 24px; }
    .g-device__scroll { height: min(820px, calc(100vh - 48px)); overflow-y: auto; scrollbar-width: none; }
    .g-device__scroll::-webkit-scrollbar { display: none; }
  }
  .g-device {
    position: relative;
    border: 1px solid var(--b-line-2);
    border-radius: 36px;
    background: var(--b-bg);
    box-shadow: var(--b-shadow-3);
    overflow: clip;
    --b-gutter: 20px;
  }
  @media (max-width: 999px) { .g-device { border-radius: var(--b-radius-lg); margin-inline: calc(var(--b-gutter) * -0.5); } }
  .g-device .b-topbar { background: var(--b-glass); }
  .g-device__progress { padding: 0 var(--b-gutter) 4px; display: flex; justify-content: center; }
  .g-device .b-step { min-height: 520px; }
  .g-device .b-summary { border-radius: 0; }

  .g-sec { padding-block: clamp(36px, 5vw, 56px); border-top: 1px solid var(--b-line); display: flex; flex-direction: column; gap: var(--b-s-6); }
  .g-sec:first-child { border-top: 0; padding-top: 0; }
  .g-sec__head { display: flex; flex-direction: column; gap: var(--b-s-2); }
  .g-sec__head .b-h2 { font-size: calc(var(--b-t-2xl) * var(--b-d-scale) * .9); }
  .g-label { font-family: var(--b-font-m); font-size: var(--b-t-2xs); letter-spacing: .12em; text-transform: uppercase; color: var(--b-mut); margin-bottom: var(--b-s-3); }
  html[lang="ar"] .g-label { font-family: var(--b-font-b); font-size: var(--b-t-xs); letter-spacing: 0; }
  .g-demo { display: flex; flex-direction: column; gap: var(--b-s-3); }
  .g-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--b-s-7); }
  @media (min-width: 720px) { .g-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .g-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--b-s-3); }
  .g-sw { display: flex; flex-direction: column; gap: 8px; }
  .g-sw i { display: block; height: 56px; border-radius: var(--b-radius); border: 1px solid var(--b-line); }
  .g-sw b { font-weight: 500; font-size: var(--b-t-sm); }
  .g-sw code { font-family: var(--b-font-m); font-size: var(--b-t-2xs); color: var(--b-mut); direction: ltr; text-align: start; }
  .g-spec { display: flex; flex-direction: column; gap: var(--b-s-5); }
  .g-spec > div { display: grid; gap: 6px; }
  .g-spec code { font-family: var(--b-font-m); font-size: var(--b-t-2xs); color: var(--b-mut); direction: ltr; justify-self: start; }
  .g-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--b-s-3); padding-block: var(--b-s-7) max(var(--b-s-7), env(safe-area-inset-bottom)); border-top: 1px solid var(--b-line); color: var(--b-mut); font-size: var(--b-t-sm); }
  .g-tl-head { display: flex; align-items: center; justify-content: space-between; gap: var(--b-s-3); flex-wrap: wrap; }
  .g-tl-head .b-h3 { font-size: calc(var(--b-t-xl) * var(--b-d-scale)); }
</style>

function dateStrip() {

  const strip = h('div', { class: 'b-dates', 'aria-label': t('date') }, days.map((d, i) =>

function hhmm(m) { return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; }

function slotGrid(dateISO) {
  const p = prayerTimes(dateISO, { minutes: true });
  const closures = ['dhuhr', 'asr', 'maghrib', 'isha'].map((k) => ({ k, from: p[k], to: p[k] + 25 }));
  const groups = [
    { key: 'morning', from: 540, to: 720 },
    { key: 'afternoon', from: 720, to: 1020 },
    { key: 'evening', from: 1020, to: 1320 },
  ];
  const seed = [...dateISO].reduce((a, c) => a + c.charCodeAt(0), 0);
  const wrap = h('div', { class: 'b-slots' });
  for (const g of groups) {
    const grid = h('div', { class: 'b-slots__grid', 'aria-label': t(g.key) });
    const items = [];
    for (let m = g.from; m < g.to; m += 30) {
      const hit = closures.find((c) => m < c.to && m + 30 > c.from);
      if (hit) {
        if (!items.some((it) => it.pause === hit.k)) items.push({ pause: hit.k, at: hit.from });
        continue;
      }
      items.push({ m, booked: (seed + m) % 7 === 0 });
    }
    for (const c of closures) {
      if (c.from >= g.from && c.from < g.to && !items.some((it) => it.pause === c.k)) items.push({ pause: c.k, at: c.from });
    }
    items.sort((a, b) => (a.m ?? a.at) - (b.m ?? b.at));
    for (const it of items) {
      if (it.pause) {
        grid.appendChild(h('div', { class: 'b-slots__pause' }, icon('clock'),
          `${t('prayer.break', { prayer: t(`prayer.${it.pause}`) })} · ${time(hhmm(it.at), L())}`));
      } else {
        const v = hhmm(it.m);
        grid.appendChild(h('button', { type: 'button', class: 'b-slot', 'data-value': v, disabled: it.booked, 'aria-checked': S.slot === v }, time(v, L())));
      }
    }
    if (grid.children.length) wrap.appendChild(h('div', { class: 'b-slots__group' }, h('p', { class: 'b-slots__label' }, t(g.key)), grid));
  }
  selectable(wrap, { selector: '.b-slot', onChange: (v) => { S.slot = v; updateSummary(); } });
  return wrap;
}

function step2() {
  const { head, strip } = dateStrip();
  const slotsHost = h('div', null, slotGrid(S.date));

      slotsHost.replaceChildren(slotGrid(v));
      updateSummary();

  return h('section', { class: 'b-step' },

}

let lastTotal = null;
function updateSummary() {
  const s = svc();
  const sub = S.step === 1
    ? (s ? `${t(`${s.key}.title`)} · ${durationMin(s.min, L())}` : t('g.pick_service'))
    : (S.slot ? `${dateLong(S.date, L(), { year: false })} · ${time(S.slot, L())}` : t('g.pick_time'));
  $('#sumSub').textContent = sub;
  const el = $('#sumTotal');
  animateNumber(el, lastTotal ?? total(), total(), { format: fmtMoney, step: 100 });
  lastTotal = total();
  const cta = $('#sumCta');
  cta.replaceChildren(h('span', null, S.step === 1 ? t('continue') : t('confirm_booking')));
  cta.disabled = S.step === 1 ? !s : !S.slot;

  const dots = $('#devDots');
  dots.replaceChildren(...[1, 2, 3].map((i) => h('span', { class: ['b-dots__dot', i < S.step && 'is-done', i === S.step && 'is-current'] })));
  const back = $('#devBack');
  back.replaceChildren(icon('back'));
  back.setAttribute('aria-label', t('back'));
  back.style.visibility = S.step === 1 ? 'hidden' : 'visible';
}

function renderStage(animate = false, direction = 'forward') {
  const next = S.step === 1 ? step1() : step2();
  const stage = $('#stage');
  if (animate) stepTransition(stage, next, direction);
  else stage.replaceChildren(next);
  updateSummary();
}

$('#sumCta').addEventListener('click', async () => {
  if (S.step === 1) {
    S.step = 2;
    haptic();
    renderStage(true, 'forward');
    $('#deviceScroll').scrollTo?.({ top: 0, behavior: 'smooth' });
    return;
  }
  const s = svc();
  const ok = await sheet({
    title: t('g.sheet.title'),
    content: kvSummary(s),
    actions: [
      { label: t('edit'), value: false, kind: 'ghost' },
      { label: t('confirm_booking'), value: true, kind: 'primary', autofocus: true, onClick: () => new Promise((r) => setTimeout(r, 700)) },
    ],
  });
  if (ok) toast(t('g.toast.ok'), { kind: 'ok' });
});
$('#devBack').addEventListener('click', () => {
  if (S.step === 1) return;
  S.step = 1;
  renderStage(true, 'back');
});

            toast(yes ? t('g.cancelled') : t('g.kept'), { kind: yes ? 'info' : 'ok' });
          },
        }))),
      demo('g.l.skeleton', skeleton(2), skeleton(3, { variant: 'line' })),
      demo('g.l.empty', h('div', { class: 'b-card' },
        h('div', { class: 'b-empty' },
          h('div', { class: 'b-empty__mark' }, icon('calendar')),
          h('h3', { class: 'b-empty__title' }, t('g.empty.title')),
          h('p', { class: 'b-empty__text' }, t('g.empty.text')),
          btn('b-btn--ghost b-btn--sm', t('g.empty.cta'), { onClick: () => toast(t('g.toast.info'), { kind: 'ok' }) }))))));
}

function secOwner() {
  const today = riyadhDateISO();
  const p = prayerTimes(today, { minutes: true });
  const stat = (label, value, delta, up) => h('div', { class: 'b-stat' },
    h('span', { class: 'b-stat__label' }, label),
    h('strong', { class: 'b-stat__value' }, ...value),
    delta && h('span', { class: ['b-stat__delta', up ? 'is-up' : 'is-down'] }, icon(up ? 'arrowUp' : 'arrowDown'), delta));
  const pct = L() === 'ar' ? '٪' : '%';
  const stats = h('div', { class: 'b-stats' },
    stat(t('g.stat.bookings'), [digits('14', L())], t('g.stat.vs', { n: `+${digits('3', L())}` }), true),
    stat(t('g.stat.revenue'), [num(5799, L()), h('small', null, t('sar'))], t('g.stat.vs', { n: `+${digits('12', L())}${pct}` }), true),
    stat(t('g.stat.occupancy'), [digits('82', L()), h('small', null, pct)], t('g.stat.vs', { n: `−${digits('4', L())}${pct}` }), false),
    stat(t('g.stat.new'), [digits('6', L())]));

  const B = [
    { at: 570, s: SERVICES[0], car: 'g.car1', st: 'completed' },
    { at: 630, s: SERVICES[2], car: 'g.car2', st: 'completed' },
    { at: 780, s: SERVICES[1], car: 'g.car3', st: 'confirmed' },
    { at: 840, s: SERVICES[0], car: 'g.car4', st: 'pending' },
    { at: 1110, s: SERVICES[2], car: 'g.car5', st: 'cancelled' },
    { at: 1170, s: SERVICES[0], car: 'g.car1', st: 'no_show' },
  ];
  const items = [
    ...B.map((b) => ({ m: b.at, el: h('li', { class: `b-tl__item b-tl__item--${b.st.replace('_', '-')}` },
      h('time', { class: 'b-tl__time' }, time(hhmm(b.at), L()), h('small', null, durationMin(b.s.min, L()))),
      h('button', { type: 'button', class: 'b-tl__card' },
        h('div', { class: 'b-tl__top' },
          h('span', { class: 'b-tl__title' }, t(`${b.s.key}.title`)),
          h('span', { class: `b-pill b-pill--${b.st.replace('_', '-')}` }, t(`status.${b.st}`))),
        h('span', { class: 'b-tl__sub' }, `${t(b.car)} · ${fmtMoney(b.s.price)}`))) })),
    { m: 760, el: h('li', { class: 'b-tl__now' }, h('span', { class: 'b-tl__time' }, t('now'))) },
    ...['dhuhr', 'asr'].map((k) => ({ m: p[k], el: h('li', { class: 'b-tl__gap' },
      h('span', { class: 'b-tl__time' }, time(hhmm(p[k]), L())),
      h('span', null, icon('clock'), t('prayer.break', { prayer: t(`prayer.${k}`) }))) })),
  ].sort((a, b) => a.m - b.m);

  const seg = h('div', { class: 'b-seg', role: 'radiogroup' },
    [['today', 'today'], ['week', 'g.seg.week']].map(([v, k], i) => h('button', { type: 'button', class: 'b-seg__opt', 'data-value': v, 'aria-checked': i === 0 }, t(k))));
  selectable(seg);

  const bookingsList = h('div', { class: 'b-list' }, B.slice(2, 5).map((b) =>
    h('button', { type: 'button', class: 'b-row' },
      h('span', { class: 'b-row__lead' }, icon('car')),
      h('span', { class: 'b-row__main' },
        h('span', { class: 'b-row__title' }, t(`${b.s.key}.title`)),
        h('span', { class: 'b-row__sub' }, `${t('today')} · ${time(hhmm(b.at), L())} · ${t(b.car)}`)),
      h('span', { class: 'b-row__end' }, h('span', { class: `b-pill b-pill--${b.st}` }, t(`status.${b.st}`))),
      icon('forward', { class: 'b-row__chev' }))));
  const servicesList = h('div', { class: 'b-list' }, SERVICES.map((s, i) =>
    h('label', { class: 'b-row' },
      h('span', { class: 'b-row__lead' }, icon('sparkle')),
      h('span', { class: 'b-row__main' },
        h('span', { class: 'b-row__title' }, t(`${s.key}.title`)),
        h('span', { class: 'b-row__sub' }, `${durationMin(s.min, L())} · ${fmtMoney(s.price)}`)),
      h('span', { class: 'b-row__end' }, h('span', { class: 'b-switch' },
        h('input', { type: 'checkbox', class: 'b-switch__input', role: 'switch', checked: i !== 2, 'aria-label': t(`${s.key}.title`) }),
        h('span', { class: 'b-switch__track', 'aria-hidden': 'true' }))))));

  const pills = rowf(...['confirmed', 'pending', 'completed', 'cancelled', 'no_show'].map((st) =>
    h('span', { class: `b-pill b-pill--${st.replace('_', '-')}` }, t(`status.${st}`))),
  h('span', { class: 'b-badge' }, t('offer')), h('span', { class: 'b-badge b-badge--soft' }, t('free')));

  return section(8, 'g.sec.owner',
    demo('g.l.stats', stats),
    h('div', { class: 'g-cols' },
      h('div', { class: 'b-stack', style: { '--_gap': 'var(--b-s-5)' } },
        h('div', { class: 'g-tl-head' }, h('h3', { class: 'b-h3' }, t('g.tl.title')), seg),
        h('p', { class: 'b-mut b-small' }, `${dateLong(today, L())} · ${tn('bookings', B.length)}`),
        h('ol', { class: 'b-tl' }, items.map((i) => i.el))),
      h('div', { class: 'b-stack', style: { '--_gap': 'var(--b-s-7)' } },
        demo('g.list.bookings', bookingsList),
        demo('g.list.services', servicesList),
        demo('g.l.pills', pills))));
}

function secType() {
  const sw = (name, v) => {
    const val = getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    return h('div', { class: 'g-sw' }, h('i', { style: { background: `var(${v})` } }), h('b', null, t(name)), h('code', null, `${v} ${val}`));
  };
  return section(9, 'g.sec.type',
    h('div', { class: 'g-cols' },
      demo('g.l.type', h('div', { class: 'g-spec' },
        h('div', null, h('code', null, '.b-display'), h('p', { class: 'b-display' }, t('g.type.d'))),
        h('div', null, h('code', null, '.b-step__q'), h('p', { class: 'b-step__q' }, t('g.type.h'))),
        h('div', null, h('code', null, '.b-lede'), h('p', { class: 'b-lede' }, t('g.type.b'))),
        h('div', null, h('code', null, 'body'), h('p', null, t('g.type.b'))),
        h('div', null, h('code', null, '.b-eyebrow'), h('span', { class: 'b-eyebrow' }, t('step_of', { n: 2, total: 3 }))))),
      demo('g.l.colors', h('div', { class: 'g-swatches' },
        sw('g.sw.bg', '--b-bg'), sw('g.sw.surface', '--b-surface'), sw('g.sw.surface2', '--b-surface-2'),
        sw('g.sw.ink', '--b-ink'), sw('g.sw.ink2', '--b-ink-2'), sw('g.sw.mut', '--b-mut'),
        sw('g.sw.accent', '--b-accent'), sw('g.sw.accentink', '--b-accent-ink'),
        sw('g.sw.ok', '--b-ok'), sw('g.sw.warn', '--b-warn'), sw('g.sw.err', '--b-err')))));
}

function renderCatalogue() {
  fieldN = 0;
  $('#catalogue').replaceChildren(secButtons(), secChoices(), secControls(), secFields(), secDateTime(), secProgress(), secFeedback(), secOwner(), secType());
}

/* ---------- theme switcher ---------- */
function renderThemeSeg() {
  const seg = $('#themeSeg');
  seg.setAttribute('aria-label', t('g.theme'));
  seg.replaceChildren(...Object.entries(THEMES).map(([k, v]) =>
    h('button', { type: 'button', class: 'b-seg__opt', 'data-value': k, 'aria-checked': k === S.theme }, t(v.label))));
}
const themeSel = selectable($('#themeSeg'), {
  onChange: (v) => {
    S.theme = v;
    setTheme();
    const u = new URL(location.href);
    u.searchParams.set('theme', v);
    history.replaceState(null, '', u);
  },
});
function revealTheme() {
  $('#themeSeg [aria-checked="true"]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function setTheme() {
  const th = THEMES[S.theme];
  applyTheme(document.documentElement, { look: th.look, theme: th.theme });
  requestAnimationFrame(() => { const s = $('#type'); if (s) s.replaceWith(secType()); });
}

/* ---------- boot ---------- */
function renderAll() {
  renderThemeSeg();
  themeSel.set(S.theme);
  revealTheme();
  renderStage(false);
  renderCatalogue();
  $('#madeBy').replaceChildren(madeBy());
  document.title = `${t('g.title')} — Mamar`;
}

boot();
setTheme();
renderAll();
onLang(() => { lastTotal = null; renderAll(); });
if (location.hash) requestAnimationFrame(() => document.getElementById(location.hash.slice(1))?.scrollIntoView());
</script>
</body>
</html>

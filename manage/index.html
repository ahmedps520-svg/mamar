<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="signature">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<meta name="description" content="لوحة المالك من ممر: الحجوزات والأسعار والعروض مباشرة.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mamar">
<title>ممر · لوحة المالك</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../platform/ui/tokens.css">
<link rel="stylesheet" href="../platform/ui/kit.css">
<link rel="stylesheet" href="./manage.css">
<script>
  /* Language and theme before first paint: no RTL/LTR flash, no light/dark flash. */
  try {
    var d = document.documentElement;
    var q = new URLSearchParams(location.search).get('lang');
    var l = q || localStorage.getItem('mamar-lang');
    if (l === 'en') { d.lang = 'en'; d.dir = 'ltr'; document.title = 'Mamar · Owner'; }
    var p = localStorage.getItem('mamar-manage-theme');
    var dark = p ? p === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    d.setAttribute('data-theme', dark ? 'signature' : 'signature-light');
    d.setAttribute('data-mode', dark ? 'dark' : 'light');
    d.style.colorScheme = dark ? 'dark' : 'light';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#08090B' : '#F4F0EA');
  } catch (e) {}
</script>
<script type="module" src="./app.js"></script>
</head>
<body class="b-app mg-body">
<div id="app">
  <div class="mg-splash" role="status" aria-label="…">
    <span class="mg-splash__mark" aria-hidden="true"><svg viewBox="0 0 34 34"><path d="M6 28V14a11 11 0 0 1 22 0v14"/><path d="M12.5 28V14.5a4.5 4.5 0 0 1 9 0V28"/></svg></span>
  </div>
</div>
<noscript><p style="padding:24px;font-family:system-ui">لوحة المالك تحتاج JavaScript. · The owner dashboard needs JavaScript.</p></noscript>
</body>
</html>

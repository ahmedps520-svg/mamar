<!doctype html>
<html lang="ar" dir="rtl" data-theme="signature">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mamar">
<title>Mamar Admin</title>
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="icon" href="/admin/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/admin/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/platform/ui/tokens.css">
<link rel="stylesheet" href="/platform/ui/kit.css">
<link rel="stylesheet" href="/admin/admin.css">
<script>
  /* Language before first paint: no RTL/LTR flash. */
  try {
    var q = new URLSearchParams(location.search).get('lang');
    var l = q === 'en' || q === 'ar' ? q : localStorage.getItem('mamar-lang');
    if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
  } catch (e) {}
</script>
<script type="module" src="/admin/app.js"></script>
</head>
<body class="b-app adm adm--boot">
  <div class="adm-splash" aria-hidden="true">
    <svg viewBox="0 0 34 34" class="adm-arch adm-arch--lg"><path d="M6 28V14a11 11 0 0 1 22 0v14"/><path d="M12.5 28V14.5a4.5 4.5 0 0 1 9 0V28"/></svg>
  </div>
  <noscript><p class="adm-noscript">Mamar Admin needs JavaScript. · تحتاج لوحة ممر إلى تفعيل JavaScript.</p></noscript>
</body>
</html>
